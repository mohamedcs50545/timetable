<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CUFE — Mechanical Engineering 1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg-app: #f8fafc;
  --bg-card: #ffffff;
  --text-main: #0f172a;
  --text-muted: #64748b;
  --border: #e2e8f0;
  --border-subtle: #f1f5f9;
  
  --c-gen: #f59e0b;
  --c-mth: #3b82f6;
  --c-emc: #8b5cf6;
  --c-mdp1: #06b6d4;
  --c-mdp2: #10b981;
  --c-epe: #f43f5e;
}

*{box-sizing:border-box;margin:0;padding:0;}
body {
  background-color: var(--bg-app);
  color: var(--text-main);
  font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
  min-height: 100vh;
  padding: 32px 20px 80px;
  -webkit-font-smoothing: antialiased;
}

.container {
  max-width: 1260px;
  margin: 0 auto;
}

/* Header */
.header {
  display: flex;
  justify-content: space-between;
  align-items: flex-end;
  flex-wrap: wrap;
  gap: 20px;
  margin-bottom: 28px;
}

.header-badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 11.5px;
  font-weight: 600;
  color: #0284c7;
  background: #e0f2fe;
  padding: 4px 10px;
  border-radius: 9999px;
  margin-bottom: 10px;
  letter-spacing: 0.02em;
}
.header-badge .pulse {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: #0284c7;
  box-shadow: 0 0 0 0 rgba(2, 132, 199, 0.4);
}

.header h1 {
  font-size: 28px;
  font-weight: 800;
  letter-spacing: -0.02em;
  color: #0f172a;
}
.header p {
  color: var(--text-muted);
  font-size: 14px;
  margin-top: 4px;
}

.meta-box {
  display: flex;
  gap: 16px;
  background: #fff;
  border: 1px solid var(--border);
  padding: 10px 16px;
  border-radius: 12px;
  box-shadow: 0 1px 2px rgba(0,0,0,0.03);
}
.meta-item {
  font-size: 12px;
  color: var(--text-muted);
}
.meta-item strong {
  display: block;
  font-size: 13px;
  color: var(--text-main);
  font-family: 'JetBrains Mono', monospace;
  font-weight: 600;
}

/* Tabs */
.tabs-wrapper {
  display: flex;
  background: #e2e8f0;
  padding: 4px;
  border-radius: 12px;
  width: fit-content;
  gap: 4px;
  margin-bottom: 24px;
  overflow-x: auto;
  max-width: 100%;
}
.tab-btn {
  border: none;
  background: transparent;
  padding: 8px 18px;
  font-family: inherit;
  font-size: 13px;
  font-weight: 600;
  color: #475569;
  border-radius: 8px;
  cursor: pointer;
  transition: all 0.18s ease;
  white-space: nowrap;
}
.tab-btn:hover {
  color: #0f172a;
}
.tab-btn.active {
  background: #ffffff;
  color: #0f172a;
  box-shadow: 0 2px 6px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04);
}

/* Timetable Grid */
.table-card {
  background: #ffffff;
  border: 1px solid var(--border);
  border-radius: 16px;
  box-shadow: 0 4px 20px -4px rgba(15, 23, 42, 0.05);
  overflow: hidden;
}
.table-scroll {
  overflow-x: auto;
}
.grid {
  display: grid;
  grid-template-columns: 110px repeat(5, minmax(180px, 1fr));
  grid-template-rows: 48px repeat(8, minmax(78px, auto));
  min-width: 960px;
}

/* Headers */
.cell-header {
  background: #f8fafc;
  border-bottom: 1px solid var(--border);
  border-right: 1px solid var(--border);
  padding: 12px 14px;
  display: flex;
  align-items: center;
  font-size: 13px;
  font-weight: 700;
  color: #334155;
  letter-spacing: 0.01em;
}
.cell-header.corner {
  background: #f1f5f9;
  font-size: 11.5px;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.06em;
  justify-content: center;
  font-family: 'JetBrains Mono', monospace;
}
.cell-header.edge-right {
  border-right: none;
}

/* Time slot label */
.time-label {
  background: #fcfdfe;
  border-bottom: 1px solid var(--border);
  border-right: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: 'JetBrains Mono', monospace;
  font-size: 12px;
  font-weight: 600;
  color: #64748b;
  letter-spacing: -0.02em;
}

/* General cell */
.cell {
  border-bottom: 1px solid var(--border);
  border-right: 1px solid var(--border);
  padding: 6px;
  display: flex;
  flex-direction: column;
}
.cell.edge-right {
  border-right: none;
}

/* Cards */
.slot-card {
  height: 100%;
  border-radius: 10px;
  padding: 10px 12px;
  display: flex;
  flex-direction: column;
  background: #ffffff;
  border: 1px solid var(--border);
  border-left: 4px solid var(--card-color);
  box-shadow: 0 2px 4px rgba(15, 23, 42, 0.02);
  transition: transform 0.15s ease, box-shadow 0.15s ease;
}
.slot-card:hover {
  transform: translateY(-1px);
  box-shadow: 0 6px 14px -3px rgba(15, 23, 42, 0.08);
}

.card-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 6px;
  margin-bottom: 6px;
}
.card-code {
  font-family: 'JetBrains Mono', monospace;
  font-weight: 700;
  font-size: 13px;
  color: #0f172a;
}
.card-badges {
  display: flex;
  align-items: center;
  gap: 4px;
}
.badge-type {
  font-size: 10px;
  font-weight: 700;
  padding: 2px 6px;
  border-radius: 4px;
  letter-spacing: 0.03em;
  text-transform: uppercase;
  color: #fff;
  background-color: var(--card-color);
}
.badge-shared {
  font-size: 9.5px;
  font-weight: 700;
  padding: 2px 6px;
  border-radius: 4px;
  background: #fef3c7;
  color: #92400e;
  border: 1px solid #fde68a;
  letter-spacing: 0.02em;
}

.card-name {
  font-size: 12px;
  font-weight: 600;
  color: #334155;
  line-height: 1.35;
  margin-bottom: 8px;
}

.card-footer {
  margin-top: auto;
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 11px;
  color: #64748b;
  font-family: 'JetBrains Mono', monospace;
  border-top: 1px dashed #edf2f7;
  padding-top: 6px;
}
.card-time {
  font-weight: 600;
  color: #475569;
}
.card-room {
  display: inline-flex;
  align-items: center;
  gap: 3px;
  background: #f1f5f9;
  padding: 2px 6px;
  border-radius: 4px;
  font-weight: 600;
  color: #334155;
}

/* Empty free slot */
.slot-empty {
  height: 100%;
  border-radius: 8px;
  background: #fafbfc;
  border: 1px dashed #e2e8f0;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 11px;
  font-weight: 600;
  color: #cbd5e1;
  font-family: 'JetBrains Mono', monospace;
  letter-spacing: 0.05em;
  text-transform: uppercase;
}

/* Legend */
.legend-box {
  margin-top: 24px;
  background: #ffffff;
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 16px 20px;
  display: flex;
  flex-wrap: wrap;
  gap: 12px 24px;
}
.legend-item {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 12.5px;
  color: var(--text-muted);
}
.legend-dot {
  width: 10px;
  height: 10px;
  border-radius: 3px;
}
.legend-item strong {
  color: var(--text-main);
  font-family: 'JetBrains Mono', monospace;
  font-weight: 700;
}

@media(max-width: 768px) {
  .header {flex-direction: column; align-items: flex-start;}
  .meta-box {width: 100%; justify-content: space-between;}
}
</style>
</head>
<body>

<div class="container">
  
  <header class="header">
    <div>
      <div class="header-badge">
        <span class="pulse"></span> Cairo University · Engineering
      </div>
      <h1>Mechanical Engineering — 1</h1>
      <p>Sophomore Fall Semester Schedule · Academic Year</p>
    </div>

    <div class="meta-box">
      <div class="meta-item">
        SECTIONS
        <strong>ME1-01 → 04</strong>
      </div>
      <div class="meta-item">
        WORK DAYS
        <strong>Sun – Thu</strong>
      </div>
      <div class="meta-item">
        TIME
        <strong>08:00 – 15:50</strong>
      </div>
    </div>
  </header>

  <div class="tabs-wrapper" id="tabs"></div>

  <div class="table-card">
    <div class="table-scroll">
      <div class="grid" id="grid"></div>
    </div>
  </div>

  <div class="legend-box" id="legend"></div>

</div>

<script>
const COURSES = {
  "GEN G119": { name: "Entrepreneurship & Innovation", color: "var(--c-gen)" },
  "MTH G102": { name: "Linear Algebra & Multivariable Integrals", color: "var(--c-mth)" },
  "EMC G101": { name: "Dynamics of Rigid Bodies", color: "var(--c-emc)" },
  "MDP G111": { name: "Computer-Aided Mechanical Drafting", color: "var(--c-mdp1)" },
  "MDP G121": { name: "Materials Science", color: "var(--c-mdp2)" },
  "EPE G113": { name: "Electrical & Electronics Engineering", color: "var(--c-epe)" },
};

const DAYS = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday"];
const SLOTS = [
  "8:00 - 8:50",
  "9:00 - 9:50",
  "10:00 - 10:50",
  "11:00 - 11:50",
  "12:00 - 12:50",
  "1:00 - 1:50",
  "2:00 - 2:50",
  "3:00 - 3:50",
];

const TIME_STARTS = ["08:00", "09:00", "10:00", "11:00", "12:00", "01:00", "02:00", "03:00"];
const TIME_ENDS   = ["08:50", "09:50", "10:50", "11:50", "12:50", "01:50", "02:50", "03:50"];

function formatTime(start, span) {
  return `${TIME_STARTS[start]} – ${TIME_ENDS[start + span - 1]}`;
}

const SESSIONS = [
  // Sunday
  { day: "Sunday", start: 0, span: 2, group: "ALL", course: "GEN G119, Lec.", room: "3103-414" },
  { day: "Sunday", start: 2, span: 3, group: "ME1-01", course: "MDP G111, Tut.", room: "15401-300" },
  { day: "Sunday", start: 2, span: 3, group: "ME1-02", course: "MDP G111, Tut.", room: "14201-50" },
  { day: "Sunday", start: 2, span: 3, group: "ME1-03", course: "EPE G113, Tut.", room: "17400-56" },

  // Monday
  { day: "Monday", start: 0, span: 2, group: "ALL", course: "MDP G121, Lec.", room: "3101-306" },
  { day: "Monday", start: 2, span: 3, group: "ME1-01", course: "EMC G101, Tut.", room: "19302-48" },
  { day: "Monday", start: 2, span: 2, group: "ME1-02", course: "MTH G102, Tut.", room: "14100-(104)" },
  { day: "Monday", start: 2, span: 3, group: "ME1-03", course: "MDP G111, Tut.", room: "15401-300" },
  { day: "Monday", start: 2, span: 3, group: "ME1-04", course: "MDP G111, Tut.", room: "14301-50" },
  { day: "Monday", start: 5, span: 3, group: "ME1-01", course: "EPE G113, Tut.", room: "19302-48" },
  { day: "Monday", start: 5, span: 3, group: "ME1-02", course: "EPE G113, Tut.", room: "17301-56" },
  { day: "Monday", start: 5, span: 2, group: "ME1-03", course: "MTH G102, Tut.", room: "17302-148" },

  // Tuesday
  { day: "Tuesday", start: 0, span: 2, group: "ALL", course: "MTH G102, Lec.", room: "7104-360" },
  { day: "Tuesday", start: 2, span: 2, group: "ALL", course: "EPE G113, Lec.", room: "7104-360" },
  { day: "Tuesday", start: 4, span: 3, group: "ME1-01", course: "MDP G121, Tut.", room: "17200-56" },
  { day: "Tuesday", start: 4, span: 3, group: "ME1-02", course: "EMC G101, Tut.", room: "17102-148" },
  { day: "Tuesday", start: 4, span: 3, group: "ME1-03", course: "MDP G121, Tut.", room: "14302-50" },

  // Wednesday
  { day: "Wednesday", start: 0, span: 2, group: "ALL", course: "MDP G111, Lec.", room: "7104-360" },
  { day: "Wednesday", start: 2, span: 3, group: "ME1-02", course: "MDP G121, Tut.", room: "14302-50" },
  { day: "Wednesday", start: 2, span: 3, group: "ME1-03", course: "EMC G101, Tut.", room: "19302-48" },
  { day: "Wednesday", start: 2, span: 3, group: "ME1-04", course: "MDP G121, Tut.", room: "19301-48" },
  { day: "Wednesday", start: 6, span: 2, group: "ALL", course: "EMC G101, Lec.", room: "7104-360" },

  // Thursday
  { day: "Thursday", start: 0, span: 3, group: "ME1-04", course: "EMC G101, Tut.", room: "14100-(104)" },
  { day: "Thursday", start: 1, span: 2, group: "ME1-01", course: "MTH G102, Tut.", room: "14301-50" },
  { day: "Thursday", start: 3, span: 2, group: "ME1-04", course: "MTH G102, Tut.", room: "14301-50" },
  { day: "Thursday", start: 5, span: 3, group: "ME1-04", course: "EPE G113, Tut.", room: "14301-50" },
];

function courseInfo(raw){
  const parts = raw.split(',');
  const code = parts[0].trim();
  const type = (parts[1] || '').trim().replace('.', '');
  const meta = COURSES[code] || { name: code, color: 'var(--c-mth)' };
  return { code, type, name: meta.name, color: meta.color };
}

function cardHTML(sess, extraLabel){
  const info = courseInfo(sess.course);
  const isShared = sess.group === 'ALL';
  const displayTitle = extraLabel ? `${extraLabel} · ${info.name}` : info.name;
  const timeStr = formatTime(sess.start, sess.span);

  return `
    <div class="slot-card" style="--card-color: ${info.color}">
      <div class="card-top">
        <span class="card-code">${info.code}</span>
        <div class="card-badges">
          ${isShared ? '<span class="badge-shared">ALL</span>' : ''}
          <span class="badge-type">${info.type}</span>
        </div>
      </div>
      <div class="card-name">${displayTitle}</div>
      <div class="card-footer">
        <span class="card-time">${timeStr}</span>
        <span class="card-room">${sess.room}</span>
      </div>
    </div>`;
}

function renderHeader(grid){
  const corner = document.createElement('div');
  corner.className = 'cell-header corner';
  corner.textContent = 'TIME';
  corner.style.gridColumn = '1';
  corner.style.gridRow = '1';
  grid.appendChild(corner);

  DAYS.forEach((d, i) => {
    const c = document.createElement('div');
    c.className = 'cell-header' + (i === DAYS.length - 1 ? ' edge-right' : '');
    c.style.gridColumn = `${i + 2}`;
    c.style.gridRow = '1';
    c.textContent = d;
    grid.appendChild(c);
  });
}

function renderGrid(group){
  const grid = document.getElementById('grid');
  grid.innerHTML = '';
  renderHeader(grid);

  SLOTS.forEach((slot, s) => {
    const timeCell = document.createElement('div');
    timeCell.className = 'time-label';
    timeCell.style.gridColumn = '1';
    timeCell.style.gridRow = `${s + 2}`;
    timeCell.textContent = slot;
    grid.appendChild(timeCell);
  });

  DAYS.forEach((day, d) => {
    const col = d + 2;
    const isLastCol = (d === DAYS.length - 1);

    const daySessions = SESSIONS.filter(s => s.day === day && (s.group === 'ALL' || s.group === group))
                                .sort((a, b) => a.start - b.start);

    let currentSlot = 0;
    daySessions.forEach(sess => {
      if (sess.start > currentSlot) {
        const freeSpan = sess.start - currentSlot;
        const freeCell = document.createElement('div');
        freeCell.className = 'cell' + (isLastCol ? ' edge-right' : '');
        freeCell.style.gridColumn = `${col}`;
        freeCell.style.gridRow = `${currentSlot + 2} / span ${freeSpan}`;
        freeCell.innerHTML = '<div class="slot-empty">FREE</div>';
        grid.appendChild(freeCell);
      }

      const cell = document.createElement('div');
      cell.className = 'cell' + (isLastCol ? ' edge-right' : '');
      cell.style.gridColumn = `${col}`;
      cell.style.gridRow = `${sess.start + 2} / span ${sess.span}`;
      cell.innerHTML = cardHTML(sess);
      grid.appendChild(cell);

      currentSlot = sess.start + sess.span;
    });

    if (currentSlot < 8) {
      const freeSpan = 8 - currentSlot;
      const freeCell = document.createElement('div');
      freeCell.className = 'cell' + (isLastCol ? ' edge-right' : '');
      freeCell.style.gridColumn = `${col}`;
      freeCell.style.gridRow = `${currentSlot + 2} / span ${freeSpan}`;
      freeCell.innerHTML = '<div class="slot-empty">FREE</div>';
      grid.appendChild(freeCell);
    }
  });
}

function renderAllGroupsGrid(){
  const grid = document.getElementById('grid');
  grid.innerHTML = '';
  renderHeader(grid);

  SLOTS.forEach((slot, s) => {
    const timeCell = document.createElement('div');
    timeCell.className = 'time-label';
    timeCell.style.gridColumn = '1';
    timeCell.style.gridRow = `${s + 2}`;
    timeCell.textContent = slot;
    grid.appendChild(timeCell);
  });

  DAYS.forEach((day, d) => {
    const col = d + 2;
    const isLastCol = (d === DAYS.length - 1);

    let s = 0;
    while (s < 8) {
      const sharedSess = SESSIONS.find(sess => sess.day === day && sess.group === 'ALL' && sess.start === s);
      if (sharedSess) {
        const cell = document.createElement('div');
        cell.className = 'cell' + (isLastCol ? ' edge-right' : '');
        cell.style.gridColumn = `${col}`;
        cell.style.gridRow = `${s + 2} / span ${sharedSess.span}`;
        cell.innerHTML = cardHTML(sharedSess);
        grid.appendChild(cell);
        s += sharedSess.span;
        continue;
      }

      const slotSess = SESSIONS.filter(sess => sess.day === day && sess.group !== 'ALL' && s >= sess.start && s < (sess.start + sess.span))
                               .sort((a, b) => a.group.localeCompare(b.group));

      const cell = document.createElement('div');
      cell.className = 'cell' + (isLastCol ? ' edge-right' : '');
      cell.style.gridColumn = `${col}`;
      cell.style.gridRow = `${s + 2}`;

      if (slotSess.length === 0) {
        cell.innerHTML = '<div class="slot-empty">FREE</div>';
      } else {
        cell.innerHTML = slotSess.map(sess => cardHTML(sess, sess.group)).join('<div style="height:6px"></div>');
      }
      grid.appendChild(cell);
      s++;
    }
  });
}

function renderLegend(){
  const legendWrap = document.getElementById('legend');
  legendWrap.innerHTML = Object.entries(COURSES).map(([code, data]) => `
    <div class="legend-item">
      <span class="legend-dot" style="background:${data.color}"></span>
      <strong>${code}</strong> ${data.name}
    </div>
  `).join('');
}

function init(){
  const tabsWrap = document.getElementById('tabs');
  const groups = ['ALL', 'ME1-01', 'ME1-02', 'ME1-03', 'ME1-04'];
  const labels = {
    'ALL': 'All Sections',
    'ME1-01': 'Section 01',
    'ME1-02': 'Section 02',
    'ME1-03': 'Section 03',
    'ME1-04': 'Section 04',
  };
  let current = 'ME1-01';

  function render(){
    tabsWrap.querySelectorAll('.tab-btn').forEach(t => t.classList.toggle('active', t.dataset.g === current));
    if (current === 'ALL'){
      renderAllGroupsGrid();
    } else {
      renderGrid(current);
    }
  }

  groups.forEach(g => {
    const btn = document.createElement('button');
    btn.className = 'tab-btn';
    btn.dataset.g = g;
    btn.textContent = labels[g];
    btn.onclick = () => { current = g; render(); };
    tabsWrap.appendChild(btn);
  });

  renderLegend();
  render();
}

document.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
