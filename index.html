<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CUFE · Mechanical Engineering-1 — Engineering Blueprint</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
:root {
  --blueprint-bg: #071322;
  --grid-line: rgba(0, 195, 255, 0.08);
  --grid-major: rgba(0, 195, 255, 0.16);
  --cyan-bright: #00d2ff;
  --cyan-dim: #008cb0;
  --paper-border: #14355a;
  
  --c-gen: #ffb703;
  --c-mth: #00e5ff;
  --c-emc: #bd00ff;
  --c-mdp1: #00b4d8;
  --c-mdp2: #06d6a0;
  --c-epe: #ef476f;
}

*{box-sizing:border-box;margin:0;padding:0;}

body {
  background-color: var(--blueprint-bg);
  color: #d6e8fa;
  font-family: 'Chakra Petch', sans-serif;
  min-height: 100vh;
  padding: 28px 20px 80px;
  background-image: 
    linear-gradient(var(--grid-major) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid-major) 1px, transparent 1px),
    linear-gradient(var(--grid-line) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
  background-size: 100px 100px, 100px 100px, 20px 20px, 20px 20px;
  -webkit-font-smoothing: antialiased;
}

.blueprint-frame {
  max-width: 1260px;
  margin: 0 auto;
  border: 2px solid var(--paper-border);
  box-shadow: 0 0 30px rgba(0, 210, 255, 0.07);
  background: rgba(7, 19, 34, 0.94);
  position: relative;
  padding: 24px;
}

/* Corner Crosshairs for CAD aesthetic */
.blueprint-frame::before, .blueprint-frame::after {
  position: absolute;
  font-family: 'Share Tech Mono', monospace;
  font-size: 14px;
  color: var(--cyan-dim);
}
.blueprint-frame::before { content: "+ [COORD: 00,00]"; top: 6px; left: 8px; }
.blueprint-frame::after { content: "+ [CAD/CAM DEPT]"; top: 6px; right: 8px; }

/* Engineering Title Block (الخرطوشة) */
.title-block {
  display: grid;
  grid-template-columns: 1fr auto;
  border: 2px solid var(--cyan-dim);
  margin-top: 14px;
  margin-bottom: 22px;
  background: rgba(0, 40, 75, 0.25);
}

.title-main {
  padding: 18px 22px;
  border-right: 2px solid var(--cyan-dim);
}
.dept-tag {
  font-family: 'Share Tech Mono', monospace;
  font-size: 11px;
  color: var(--cyan-bright);
  letter-spacing: 0.15em;
  text-transform: uppercase;
}
.title-main h1 {
  font-size: 26px;
  font-weight: 700;
  letter-spacing: 0.03em;
  color: #ffffff;
  text-transform: uppercase;
  margin-top: 4px;
}
.title-main p {
  font-family: 'Share Tech Mono', monospace;
  font-size: 12px;
  color: #7ba1c7;
  margin-top: 4px;
}

.meta-grid {
  display: grid;
  grid-template-columns: repeat(3, 110px);
  grid-template-rows: 1fr 1fr;
  font-family: 'Share Tech Mono', monospace;
}
.meta-cell {
  border-bottom: 1px solid var(--paper-border);
  border-right: 1px solid var(--paper-border);
  padding: 6px 10px;
  font-size: 10px;
  color: #5d84ab;
}
.meta-cell:nth-child(3), .meta-cell:nth-child(6) {border-right: none;}
.meta-cell:nth-child(4), .meta-cell:nth-child(5), .meta-cell:nth-child(6) {border-bottom: none;}
.meta-cell strong {
  display: block;
  font-size: 12px;
  color: #fff;
  margin-top: 2px;
}

/* Section Selectors */
.controls-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 12px;
  margin-bottom: 18px;
}
.tabs-label {
  font-family: 'Share Tech Mono', monospace;
  font-size: 12px;
  color: var(--cyan-bright);
  display: flex;
  align-items: center;
  gap: 8px;
}
.tabs-row {
  display: flex;
  gap: 6px;
  background: rgba(14, 38, 66, 0.6);
  border: 1px solid var(--paper-border);
  padding: 4px;
}
.tab-btn {
  border: 1px solid transparent;
  background: transparent;
  color: #7ba1c7;
  padding: 6px 16px;
  font-family: 'Share Tech Mono', monospace;
  font-size: 12px;
  cursor: pointer;
  transition: all 0.15s ease;
}
.tab-btn:hover {
  color: #fff;
  border-color: var(--cyan-dim);
}
.tab-btn.active {
  background: var(--cyan-bright);
  color: #04101e;
  font-weight: 700;
  box-shadow: 0 0 12px rgba(0, 210, 255, 0.4);
}

/* Drawing Board Grid */
.sheet-scroll {
  overflow-x: auto;
  border: 2px solid var(--paper-border);
  background: #06111f;
}
.grid {
  display: grid;
  grid-template-columns: 105px repeat(5, minmax(200px, 1fr));
  grid-template-rows: 40px repeat(8, minmax(78px, auto));
  min-width: 1050px;
}

.cell-head {
  background: #091a2e;
  border-bottom: 2px solid var(--paper-border);
  border-right: 1px solid var(--paper-border);
  padding: 8px 12px;
  font-family: 'Share Tech Mono', monospace;
  font-size: 13px;
  font-weight: 700;
  color: var(--cyan-bright);
  display: flex;
  align-items: center;
  letter-spacing: 0.05em;
}
.cell-head.corner {
  justify-content: center;
  background: #050e1a;
  color: #486e96;
}
.cell-head.edge-right {border-right: none;}

.time-axis {
  background: #081628;
  border-bottom: 1px solid var(--paper-border);
  border-right: 2px solid var(--paper-border);
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: 'Share Tech Mono', monospace;
  font-size: 11px;
  color: #628bb5;
  letter-spacing: -0.02em;
}

.cell {
  border-bottom: 1px solid var(--paper-border);
  border-right: 1px solid var(--paper-border);
  padding: 5px;
  display: flex;
  flex-direction: column;
  position: relative;
}
.cell.edge-right {border-right: none;}

/* Technical Blueprint Blocks */
.slot-card {
  height: 100%;
  padding: 8px 10px;
  display: flex;
  flex-direction: column;
  background: rgba(9, 29, 52, 0.85);
  border: 1px solid var(--color);
  box-shadow: inset 0 0 10px rgba(0, 0, 0, 0.5);
  position: relative;
}
.slot-card::before {
  content: "";
  position: absolute;
  top: 0; left: 0;
  width: 4px; height: 100%;
  background: var(--color);
}

.card-top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 6px;
}
.card-code {
  font-family: 'Share Tech Mono', monospace;
  font-size: 13px;
  font-weight: 700;
  color: #fff;
  letter-spacing: 0.05em;
}
.card-tags {
  display: flex;
  gap: 4px;
}
.tag {
  font-family: 'Share Tech Mono', monospace;
  font-size: 9px;
  padding: 1px 4px;
  border: 1px solid var(--color);
  color: var(--color);
  font-weight: 700;
}
.tag.all {
  background: rgba(255, 183, 3, 0.15);
  border-color: #ffb703;
  color: #ffb703;
}

.card-name {
  font-size: 11.5px;
  color: #a4c4e4;
  margin-top: 4px;
  line-height: 1.25;
  font-weight: 500;
}

.card-footer {
  margin-top: auto;
  padding-top: 6px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-family: 'Share Tech Mono', monospace;
  font-size: 10px;
  border-top: 1px dashed rgba(20, 53, 90, 0.8);
}
.card-time {
  color: #00d2ff;
}
.card-room {
  color: #fff;
  background: rgba(0, 0, 0, 0.35);
  padding: 1px 5px;
  border: 1px solid var(--paper-border);
}

/* Empty Slots */
.slot-empty {
  height: 100%;
  background: rgba(4, 13, 23, 0.4);
  border: 1px dashed rgba(20, 53, 90, 0.4);
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: 'Share Tech Mono', monospace;
  font-size: 10px;
  color: #27476c;
  letter-spacing: 0.1em;
}

/* Technical Specs Legend */
.legend-strip {
  margin-top: 20px;
  border: 1px solid var(--paper-border);
  background: rgba(6, 17, 31, 0.8);
  padding: 12px 16px;
  display: flex;
  flex-wrap: wrap;
  gap: 12px 24px;
  font-family: 'Share Tech Mono', monospace;
  font-size: 11.5px;
}
.legend-item {
  display: flex;
  align-items: center;
  gap: 8px;
}
.legend-box {
  width: 8px;
  height: 8px;
  border: 1px solid var(--c);
  background: var(--c);
}
.legend-item b {
  color: #fff;
}

@media(max-width: 840px) {
  .title-block {grid-template-columns: 1fr;}
  .title-main {border-right: none; border-bottom: 2px solid var(--cyan-dim);}
  .meta-grid {grid-template-columns: repeat(3, 1fr);}
}
</style>
</head>
<body>

<div class="blueprint-frame">

  <!-- CAD Drawing Title Block -->
  <header class="title-block">
    <div class="title-main">
      <div class="dept-tag">FACULTY OF ENGINEERING · CAIRO UNIVERSITY</div>
      <h1>DEPARTMENT OF MECHANICAL ENGINEERING</h1>
      <p>TIMETABLE SPECIFICATION · SOPHOMORE LEVEL (ME-1) · FALL</p>
    </div>
    <div class="meta-grid">
      <div class="meta-cell">DWG NO.<strong>CUFE-ME-01</strong></div>
      <div class="meta-cell">SCALE<strong>1:1 FULL</strong></div>
      <div class="meta-cell">SECTIONS<strong>01 — 04</strong></div>
      <div class="meta-cell">STATUS<strong>APPROVED</strong></div>
      <div class="meta-cell">PROJECTION<strong>3RD ANGLE</strong></div>
      <div class="meta-cell">UNITS<strong>HRS:MIN</strong></div>
    </div>
  </header>

  <!-- Controls -->
  <div class="controls-bar">
    <div class="tabs-label">
      <span>&#9654; SECTION ACTIVE VIEW:</span>
    </div>
    <div class="tabs-row" id="tabs"></div>
  </div>

  <!-- Drawing Sheet -->
  <div class="sheet-scroll">
    <div class="grid" id="grid"></div>
  </div>

  <!-- Legend -->
  <div class="legend-strip" id="legend"></div>

</div>

<script>
const COURSES = {
  "GEN G119": { name: "Entrepreneurship & Innovation", color: "var(--c-gen)" },
  "MTH G102": { name: "Linear Algebra & Multivariable Integrals", color: "var(--c-mth)" },
  "EMC G101": { name: "Dynamics of Rigid Bodies", color: "var(--c-emc)" },
  "MDP G111": { name: "Computer-Aided Mechanical Drafting", color: "var(--c-mdp1)" },
  "MDP G121": { name: "Materials Science", color: "var(--c-mdp2)" },
  "EPE G113": { name: "Electrical & Electronics Engineering", color: "var(--c-epe)" },
};

const DAYS = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday"];
const SLOTS = [
  "08:00-08:50",
  "09:00-09:50",
  "10:00-10:50",
  "11:00-11:50",
  "12:00-12:50",
  "13:00-13:50",
  "14:00-14:50",
  "15:00-15:50",
];

const TIME_STARTS = ["08:00", "09:00", "10:00", "11:00", "12:00", "13:00", "14:00", "15:00"];
const TIME_ENDS   = ["08:50", "09:50", "10:50", "11:50", "12:50", "13:50", "14:50", "15:50"];

function formatTime(start, span) {
  return `${TIME_STARTS[start]} - ${TIME_ENDS[start + span - 1]}`;
}

const SESSIONS = [
  // Sunday
  { day: "Sunday", start: 0, span: 2, group: "ALL", course: "GEN G119, Lec.", room: "3103-414" },
  { day: "Sunday", start: 2, span: 3, group: "ME1-01", course: "MDP G111, Tut.", room: "15401-300" },
  { day: "Sunday", start: 2, span: 3, group: "ME1-02", course: "MDP G111, Tut.", room: "14201-50" },
  { day: "Sunday", start: 2, span: 3, group: "ME1-03", course: "EPE G113, Tut.", room: "17400-56" },

  // Monday
  { day: "Monday", start: 0, span: 2, group: "ALL", course: "MDP G121, Lec.", room: "3101-306" },
  { day: "Monday", start: 2, span: 3, group: "ME1-01", course: "EMC G101, Tut.", room: "19302-48" },
  { day: "Monday", start: 2, span: 2, group: "ME1-02", course: "MTH G102, Tut.", room: "14100-(104)" },
  { day: "Monday", start: 2, span: 3, group: "ME1-03", course: "MDP G111, Tut.", room: "15401-300" },
  { day: "Monday", start: 2, span: 3, group: "ME1-04", course: "MDP G111, Tut.", room: "14301-50" },
  { day: "Monday", start: 5, span: 3, group: "ME1-01", course: "EPE G113, Tut.", room: "19302-48" },
  { day: "Monday", start: 5, span: 3, group: "ME1-02", course: "EPE G113, Tut.", room: "17301-56" },
  { day: "Monday", start: 5, span: 2, group: "ME1-03", course: "MTH G102, Tut.", room: "17302-148" },

  // Tuesday
  { day: "Tuesday", start: 0, span: 2, group: "ALL", course: "MTH G102, Lec.", room: "7104-360" },
  { day: "Tuesday", start: 2, span: 2, group: "ALL", course: "EPE G113, Lec.", room: "7104-360" },
  { day: "Tuesday", start: 4, span: 3, group: "ME1-01", course: "MDP G121, Tut.", room: "17200-56" },
  { day: "Tuesday", start: 4, span: 3, group: "ME1-02", course: "EMC G101, Tut.", room: "17102-148" },
  { day: "Tuesday", start: 4, span: 3, group: "ME1-03", course: "MDP G121, Tut.", room: "14302-50" },

  // Wednesday
  { day: "Wednesday", start: 0, span: 2, group: "ALL", course: "MDP G111, Lec.", room: "7104-360" },
  { day: "Wednesday", start: 2, span: 3, group: "ME1-02", course: "MDP G121, Tut.", room: "14302-50" },
  { day: "Wednesday", start: 2, span: 3, group: "ME1-03", course: "EMC G101, Tut.", room: "19302-48" },
  { day: "Wednesday", start: 2, span: 3, group: "ME1-04", course: "MDP G121, Tut.", room: "19301-48" },
  { day: "Wednesday", start: 6, span: 2, group: "ALL", course: "EMC G101, Lec.", room: "7104-360" },

  // Thursday
  { day: "Thursday", start: 0, span: 3, group: "ME1-04", course: "EMC G101, Tut.", room: "14100-(104)" },
  { day: "Thursday", start: 1, span: 2, group: "ME1-01", course: "MTH G102, Tut.", room: "14301-50" },
  { day: "Thursday", start: 3, span: 2, group: "ME1-04", course: "MTH G102, Tut.", room: "14301-50" },
  { day: "Thursday", start: 5, span: 3, group: "ME1-04", course: "EPE G113, Tut.", room: "14301-50" },
];

function courseInfo(raw){
  const parts = raw.split(',');
  const code = parts[0].trim();
  const type = (parts[1] || '').trim().replace('.', '');
  const meta = COURSES[code] || { name: code, color: 'var(--c-mth)' };
  return { code, type, name: meta.name, color: meta.color };
}

function cardHTML(sess, extraLabel){
  const info = courseInfo(sess.course);
  const isShared = sess.group === 'ALL';
  const displayTitle = extraLabel ? `[${extraLabel}] ${info.name}` : info.name;
  const timeStr = formatTime(sess.start, sess.span);

  return `
    <div class="slot-card" style="--color: ${info.color}">
      <div class="card-top">
        <span class="card-code">${info.code}</span>
        <div class="card-tags">
          ${isShared ? '<span class="tag all">ALL</span>' : ''}
          <span class="tag">${info.type}</span>
        </div>
      </div>
      <div class="card-name">${displayTitle}</div>
      <div class="card-footer">
        <span class="card-time">${timeStr}</span>
        <span class="card-room">RM ${sess.room}</span>
      </div>
    </div>`;
}

function renderHeader(grid){
  const corner = document.createElement('div');
  corner.className = 'cell-head corner';
  corner.textContent = 'SEC//TIME';
  corner.style.gridColumn = '1';
  corner.style.gridRow = '1';
  grid.appendChild(corner);

  DAYS.forEach((d, i) => {
    const c = document.createElement('div');
    c.className = 'cell-head' + (i === DAYS.length - 1 ? ' edge-right' : '');
    c.style.gridColumn = `${i + 2}`;
    c.style.gridRow = '1';
    c.textContent = d.toUpperCase();
    grid.appendChild(c);
  });
}

function renderGrid(group){
  const grid = document.getElementById('grid');
  grid.innerHTML = '';
  renderHeader(grid);

  SLOTS.forEach((slot, s) => {
    const timeCell = document.createElement('div');
    timeCell.className = 'time-axis';
    timeCell.style.gridColumn = '1';
    timeCell.style.gridRow = `${s + 2}`;
    timeCell.textContent = slot;
    grid.appendChild(timeCell);
  });

  DAYS.forEach((day, d) => {
    const col = d + 2;
    const isLastCol = (d === DAYS.length - 1);

    const daySessions = SESSIONS.filter(s => s.day === day && (s.group === 'ALL' || s.group === group))
                                .sort((a, b) => a.start - b.start);

    let currentSlot = 0;
    daySessions.forEach(sess => {
      if (sess.start > currentSlot) {
        const freeSpan = sess.start - currentSlot;
        const freeCell = document.createElement('div');
        freeCell.className = 'cell' + (isLastCol ? ' edge-right' : '');
        freeCell.style.gridColumn = `${col}`;
        freeCell.style.gridRow = `${currentSlot + 2} / span ${freeSpan}`;
        freeCell.innerHTML = '<div class="slot-empty">// IDLE</div>';
        grid.appendChild(freeCell);
      }

      const cell = document.createElement('div');
      cell.className = 'cell' + (isLastCol ? ' edge-right' : '');
      cell.style.gridColumn = `${col}`;
      cell.style.gridRow = `${sess.start + 2} / span ${sess.span}`;
      cell.innerHTML = cardHTML(sess);
      grid.appendChild(cell);

      currentSlot = sess.start + sess.span;
    });

    if (currentSlot < 8) {
      const freeSpan = 8 - currentSlot;
      const freeCell = document.createElement('div');
      freeCell.className = 'cell' + (isLastCol ? ' edge-right' : '');
      freeCell.style.gridColumn = `${col}`;
      freeCell.style.gridRow = `${currentSlot + 2} / span ${freeSpan}`;
      freeCell.innerHTML = '<div class="slot-empty">// IDLE</div>';
      grid.appendChild(freeCell);
    }
  });
}

function renderAllGroupsGrid(){
  const grid = document.getElementById('grid');
  grid.innerHTML = '';
  renderHeader(grid);

  SLOTS.forEach((slot, s) => {
    const timeCell = document.createElement('div');
    timeCell.className = 'time-axis';
    timeCell.style.gridColumn = '1';
    timeCell.style.gridRow = `${s + 2}`;
    timeCell.textContent = slot;
    grid.appendChild(timeCell);
  });

  DAYS.forEach((day, d) => {
    const col = d + 2;
    const isLastCol = (d === DAYS.length - 1);

    let s = 0;
    while (s < 8) {
      const sharedSess = SESSIONS.find(sess => sess.day === day && sess.group === 'ALL' && sess.start === s);
      if (sharedSess) {
        const cell = document.createElement('div');
        cell.className = 'cell' + (isLastCol ? ' edge-right' : '');
        cell.style.gridColumn = `${col}`;
        cell.style.gridRow = `${s + 2} / span ${sharedSess.span}`;
        cell.innerHTML = cardHTML(sharedSess);
        grid.appendChild(cell);
        s += sharedSess.span;
        continue;
      }

      const slotSess = SESSIONS.filter(sess => sess.day === day && sess.group !== 'ALL' && s >= sess.start && s < (sess.start + sess.span))
                               .sort((a, b) => a.group.localeCompare(b.group));

      const cell = document.createElement('div');
      cell.className = 'cell' + (isLastCol ? ' edge-right' : '');
      cell.style.gridColumn = `${col}`;
      cell.style.gridRow = `${s + 2}`;

      if (slotSess.length === 0) {
        cell.innerHTML = '<div class="slot-empty">// IDLE</div>';
      } else {
        cell.innerHTML = slotSess.map(sess => cardHTML(sess, sess.group)).join('<div style="height:4px"></div>');
      }
      grid.appendChild(cell);
      s++;
    }
  });
}

function renderLegend(){
  const legendWrap = document.getElementById('legend');
  legendWrap.innerHTML = Object.entries(COURSES).map(([code, data]) => `
    <div class="legend-item">
      <span class="legend-box" style="--c: ${data.color}"></span>
      <b>${code}</b> [${data.name}]
    </div>
  `).join('');
}

function init(){
  const tabsWrap = document.getElementById('tabs');
  const groups = ['ALL', 'ME1-01', 'ME1-02', 'ME1-03', 'ME1-04'];
  const labels = {
    'ALL': 'DEPT-FULL',
    'ME1-01': 'SEC:01',
    'ME1-02': 'SEC:02',
    'ME1-03': 'SEC:03',
    'ME1-04': 'SEC:04',
  };
  let current = 'ME1-01';

  function render(){
    tabsWrap.querySelectorAll('.tab-btn').forEach(t => t.classList.toggle('active', t.dataset.g === current));
    if (current === 'ALL'){
      renderAllGroupsGrid();
    } else {
      renderGrid(current);
    }
  }

  groups.forEach(g => {
    const btn = document.createElement('button');
    btn.className = 'tab-btn';
    btn.dataset.g = g;
    btn.textContent = labels[g];
    btn.onclick = () => { current = g; render(); };
    tabsWrap.appendChild(btn);
  });

  renderLegend();
  render();
}

document.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
