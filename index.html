<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CUFE · Mechanical 1 Agenda</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f8fafc;
  --surface: #ffffff;
  --border: #e2e8f0;
  --border-light: #f1f5f9;
  --text-main: #0f172a;
  --text-muted: #64748b;
  --text-subtle: #94a3b8;
  
  --c-gen: #d97706;
  --c-mth: #2563eb;
  --c-emc: #7c3aed;
  --c-mdp1: #0284c7;
  --c-mdp2: #059669;
  --c-epe: #e11d48;
}

*{box-sizing:border-box;margin:0;padding:0;}

body {
  background-color: var(--bg);
  color: var(--text-main);
  font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
  min-height: 100vh;
  padding: 24px 16px 80px;
  -webkit-font-smoothing: antialiased;
}

.app-frame {
  max-width: 620px;
  margin: 0 auto;
}

/* Header & Controls */
.header {
  margin-bottom: 20px;
}
.header-top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 12px;
}
.brand {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: #0284c7;
}
.section-select {
  background: var(--surface);
  border: 1px solid var(--border);
  color: var(--text-main);
  font-family: inherit;
  font-size: 13px;
  font-weight: 600;
  padding: 6px 12px;
  border-radius: 8px;
  outline: none;
  cursor: pointer;
}

.page-title {
  font-size: 24px;
  font-weight: 800;
  color: var(--text-main);
  letter-spacing: -0.02em;
}

/* Day Selector */
.days-bar {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 6px;
  background: #edf2f7;
  padding: 4px;
  border-radius: 12px;
  margin: 18px 0 24px;
}
.day-btn {
  border: none;
  background: transparent;
  padding: 10px 4px;
  border-radius: 8px;
  cursor: pointer;
  text-align: center;
  transition: all 0.15s ease;
}
.day-btn .day-name {
  display: block;
  font-size: 12px;
  font-weight: 600;
  color: var(--text-muted);
}
.day-btn .day-code {
  display: block;
  font-size: 11px;
  color: var(--text-subtle);
  margin-top: 2px;
}
.day-btn.active {
  background: var(--surface);
  box-shadow: 0 2px 4px rgba(15, 23, 42, 0.06);
}
.day-btn.active .day-name {
  color: var(--text-main);
  font-weight: 800;
}
.day-btn.active .day-code {
  color: #0284c7;
  font-weight: 700;
}

/* Timeline Track */
.timeline {
  position: relative;
  display: flex;
  flex-direction: column;
  gap: 16px;
}

.timeline-item {
  display: flex;
  gap: 14px;
  position: relative;
}

/* Left Time Axis */
.time-col {
  width: 90px;
  flex-shrink: 0;
  text-align: right;
  padding-top: 2px;
}
.time-start {
  font-family: 'JetBrains Mono', monospace;
  font-size: 13px;
  font-weight: 700;
  color: var(--text-main);
}
.time-end {
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  color: var(--text-muted);
  margin-top: 2px;
}
.time-dur {
  display: inline-block;
  font-size: 10px;
  font-weight: 600;
  background: #f1f5f9;
  color: var(--text-muted);
  padding: 2px 6px;
  border-radius: 4px;
  margin-top: 6px;
}

/* Vertical Rail */
.rail {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
}
.rail-dot {
  width: 11px;
  height: 11px;
  border-radius: 50%;
  border: 2.5px solid var(--c);
  background: #fff;
  z-index: 2;
  margin-top: 4px;
}
.rail-line {
  position: absolute;
  top: 18px;
  bottom: -22px;
  width: 2px;
  background: #e2e8f0;
}
.timeline-item:last-child .rail-line {
  display: none;
}

/* Event Card */
.event-card {
  flex: 1;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 14px 16px;
  box-shadow: 0 1px 3px rgba(15, 23, 42, 0.03);
  transition: transform 0.15s ease, box-shadow 0.15s ease;
}
.event-card:hover {
  transform: translateY(-1px);
  box-shadow: 0 4px 12px rgba(15, 23, 42, 0.06);
}

.card-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 6px;
}
.card-code {
  font-family: 'JetBrains Mono', monospace;
  font-size: 12.5px;
  font-weight: 700;
  color: var(--c);
}
.badges-group {
  display: flex;
  gap: 4px;
}
.badge {
  font-size: 10px;
  font-weight: 700;
  padding: 2px 7px;
  border-radius: 4px;
  letter-spacing: 0.02em;
}
.badge-type {
  background: #f1f5f9;
  color: #475569;
}
.badge-all {
  background: #fef3c7;
  color: #b45309;
}

.card-title {
  font-size: 14px;
  font-weight: 700;
  color: var(--text-main);
  line-height: 1.35;
  margin-bottom: 10px;
}

.card-room {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-size: 11.5px;
  color: var(--text-muted);
  background: #f8fafc;
  padding: 4px 9px;
  border-radius: 6px;
  border: 1px solid var(--border-light);
  font-weight: 500;
}
.card-room svg {
  width: 12px;
  height: 12px;
  fill: currentColor;
}

/* Break Card */
.break-item {
  display: flex;
  align-items: center;
  gap: 14px;
  margin: -4px 0;
}
.break-spacer {
  width: 90px;
  flex-shrink: 0;
}
.break-card {
  flex: 1;
  border: 1px dashed #cbd5e1;
  background: rgba(241, 245, 249, 0.5);
  border-radius: 8px;
  padding: 8px 14px;
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 12px;
  color: var(--text-muted);
  font-weight: 500;
}

/* Empty State */
.empty-day {
  background: var(--surface);
  border: 1px dashed var(--border);
  border-radius: 14px;
  padding: 40px 20px;
  text-align: center;
  color: var(--text-muted);
}
.empty-day .icon {
  font-size: 28px;
  margin-bottom: 8px;
}
.empty-day h3 {
  font-size: 15px;
  color: var(--text-main);
  font-weight: 700;
}
.empty-day p {
  font-size: 13px;
  margin-top: 4px;
}
</style>
</head>
<body>

<div class="app-frame">

  <header class="header">
    <div class="header-top">
      <span class="brand">Cairo University · ME</span>
      <select class="section-select" id="sectionSelect">
        <option value="ME1-01">Section 01</option>
        <option value="ME1-02">Section 02</option>
        <option value="ME1-03">Section 03</option>
        <option value="ME1-04">Section 04</option>
      </select>
    </div>
    <h1 class="page-title" id="dayTitle">Sunday</h1>
  </header>

  <div class="days-bar" id="daysBar"></div>

  <main class="timeline" id="timelineList"></main>

</div>

<script>
const COURSES = {
  "GEN G119": { name: "Entrepreneurship & Innovation", color: "var(--c-gen)" },
  "MTH G102": { name: "Linear Algebra & Multivariable Integrals", color: "var(--c-mth)" },
  "EMC G101": { name: "Dynamics of Rigid Bodies", color: "var(--c-emc)" },
  "MDP G111": { name: "Computer-Aided Mechanical Drafting", color: "var(--c-mdp1)" },
  "MDP G121": { name: "Materials Science", color: "var(--c-mdp2)" },
  "EPE G113": { name: "Electrical & Electronics Engineering", color: "var(--c-epe)" },
};

const DAYS = [
  { full: "Sunday", short: "SUN", code: "Day 1" },
  { full: "Monday", short: "MON", code: "Day 2" },
  { full: "Tuesday", short: "TUE", code: "Day 3" },
  { full: "Wednesday", short: "WED", code: "Day 4" },
  { full: "Thursday", short: "THU", code: "Day 5" }
];

const SCHEDULE = [
  // Sunday
  { day: "Sunday", start: "08:00", end: "09:50", dur: "1h 50m", group: "ALL", code: "GEN G119", type: "Lecture", room: "Hall 3103-414" },
  { day: "Sunday", start: "10:00", end: "12:50", dur: "2h 50m", group: "ME1-01", code: "MDP G111", type: "Tutorial / Lab", room: "Drawing Lab 15401-300" },
  { day: "Sunday", start: "10:00", end: "12:50", dur: "2h 50m", group: "ME1-02", code: "MDP G111", type: "Tutorial / Lab", room: "Room 14201-50" },
  { day: "Sunday", start: "10:00", end: "12:50", dur: "2h 50m", group: "ME1-03", code: "EPE G113", type: "Tutorial / Lab", room: "Room 17400-56" },

  // Monday
  { day: "Monday", start: "08:00", end: "09:50", dur: "1h 50m", group: "ALL", code: "MDP G121", type: "Lecture", room: "Hall 3101-306" },
  { day: "Monday", start: "10:00", end: "12:50", dur: "2h 50m", group: "ME1-01", code: "EMC G101", type: "Tutorial", room: "Room 19302-48" },
  { day: "Monday", start: "10:00", end: "11:50", dur: "1h 50m", group: "ME1-02", code: "MTH G102", type: "Tutorial", room: "Room 14100-(104)" },
  { day: "Monday", start: "10:00", end: "12:50", dur: "2h 50m", group: "ME1-03", code: "MDP G111", type: "Tutorial / Lab", room: "Drawing Lab 15401-300" },
  { day: "Monday", start: "10:00", end: "12:50", dur: "2h 50m", group: "ME1-04", code: "MDP G111", type: "Tutorial / Lab", room: "Room 14301-50" },
  { day: "Monday", start: "13:00", end: "15:50", dur: "2h 50m", group: "ME1-01", code: "EPE G113", type: "Tutorial / Lab", room: "Room 19302-48" },
  { day: "Monday", start: "13:00", end: "15:50", dur: "2h 50m", group: "ME1-02", code: "EPE G113", type: "Tutorial / Lab", room: "Room 17301-56" },
  { day: "Monday", start: "13:00", end: "14:50", dur: "1h 50m", group: "ME1-03", code: "MTH G102", type: "Tutorial", room: "Room 17302-148" },

  // Tuesday
  { day: "Tuesday", start: "08:00", end: "09:50", dur: "1h 50m", group: "ALL", code: "MTH G102", type: "Lecture", room: "Hall 7104-360" },
  { day: "Tuesday", start: "10:00", end: "11:50", dur: "1h 50m", group: "ALL", code: "EPE G113", type: "Lecture", room: "Hall 7104-360" },
  { day: "Tuesday", start: "12:00", end: "14:50", dur: "2h 50m", group: "ME1-01", code: "MDP G121", type: "Tutorial", room: "Room 17200-56" },
  { day: "Tuesday", start: "12:00", end: "14:50", dur: "2h 50m", group: "ME1-02", code: "EMC G101", type: "Tutorial", room: "Room 17102-148" },
  { day: "Tuesday", start: "12:00", end: "14:50", dur: "2h 50m", group: "ME1-03", code: "MDP G121", type: "Tutorial", room: "Room 14302-50" },

  // Wednesday
  { day: "Wednesday", start: "08:00", end: "09:50", dur: "1h 50m", group: "ALL", code: "MDP G111", type: "Lecture", room: "Hall 7104-360" },
  { day: "Wednesday", start: "10:00", end: "12:50", dur: "2h 50m", group: "ME1-02", code: "MDP G121", type: "Tutorial", room: "Room 14302-50" },
  { day: "Wednesday", start: "10:00", end: "12:50", dur: "2h 50m", group: "ME1-03", code: "EMC G101", type: "Tutorial", room: "Room 19302-48" },
  { day: "Wednesday", start: "10:00", end: "12:50", dur: "2h 50m", group: "ME1-04", code: "MDP G121", type: "Tutorial", room: "Room 19301-48" },
  { day: "Wednesday", start: "14:00", end: "15:50", dur: "1h 50m", group: "ALL", code: "EMC G101", type: "Lecture", room: "Hall 7104-360" },

  // Thursday
  { day: "Thursday", start: "08:00", end: "10:50", dur: "2h 50m", group: "ME1-04", code: "EMC G101", type: "Tutorial", room: "Room 14100-(104)" },
  { day: "Thursday", start: "09:00", end: "10:50", dur: "1h 50m", group: "ME1-01", code: "MTH G102", type: "Tutorial", room: "Room 14301-50" },
  { day: "Thursday", start: "11:00", end: "12:50", dur: "1h 50m", group: "ME1-04", code: "MTH G102", type: "Tutorial", room: "Room 14301-50" },
  { day: "Thursday", start: "13:00", end: "15:50", dur: "2h 50m", group: "ME1-04", code: "EPE G113", type: "Tutorial / Lab", room: "Room 14301-50" }
];

// Smart Day Selection
const jsDay = new Date().getDay();
let activeDay = (jsDay >= 0 && jsDay <= 4) ? DAYS[jsDay].full : "Sunday";
let activeGroup = "ME1-01";

function parseMinutes(t) {
  const [h, m] = t.split(":").map(Number);
  return h * 60 + m;
}

function renderDaysBar() {
  const bar = document.getElementById("daysBar");
  bar.innerHTML = DAYS.map(d => `
    <button class="day-btn ${d.full === activeDay ? 'active' : ''}" onclick="selectDay('${d.full}')">
      <span class="day-name">${d.short}</span>
      <span class="day-code">${d.code}</span>
    </button>
  `).join("");
}

function renderTimeline() {
  document.getElementById("dayTitle").textContent = activeDay;
  const list = document.getElementById("timelineList");

  const sessions = SCHEDULE.filter(s => s.day === activeDay && (s.group === "ALL" || s.group === activeGroup))
                           .sort((a, b) => parseMinutes(a.start) - parseMinutes(b.start));

  if (sessions.length === 0) {
    list.innerHTML = `
      <div class="empty-day">
        <div class="icon">☕</div>
        <h3>No classes scheduled</h3>
        <p>Enjoy your day off!</p>
      </div>`;
    return;
  }

  let html = "";
  for (let i = 0; i < sessions.length; i++) {
    const s = sessions[i];
    const course = COURSES[s.code] || { name: s.code, color: "var(--c-mth)" };
    const isShared = s.group === "ALL";

    // Break gap detection
    if (i > 0) {
      const prevEnd = parseMinutes(sessions[i - 1].end);
      const currStart = parseMinutes(s.start);
      const diff = currStart - prevEnd;
      if (diff > 10) {
        const hrs = Math.floor(diff / 60);
        const mins = diff % 60;
        const diffStr = hrs > 0 ? `${hrs}h ${mins > 0 ? mins + 'm' : ''}` : `${mins}m`;
        html += `
          <div class="break-item">
            <div class="break-spacer"></div>
            <div class="break-card">☕ Break · ${diffStr}</div>
          </div>`;
      }
    }

    html += `
      <div class="timeline-item">
        <div class="time-col">
          <div class="time-start">${s.start}</div>
          <div class="time-end">${s.end}</div>
          <span class="time-dur">${s.dur}</span>
        </div>
        <div class="rail">
          <div class="rail-dot" style="--c: ${course.color}"></div>
          <div class="rail-line"></div>
        </div>
        <div class="event-card">
          <div class="card-top">
            <span class="card-code" style="--c: ${course.color}">${s.code}</span>
            <div class="badges-group">
              ${isShared ? '<span class="badge badge-all">ALL GROUPS</span>' : ''}
              <span class="badge badge-type">${s.type}</span>
            </div>
          </div>
          <div class="card-title">${course.name}</div>
          <div class="card-room">
            <svg viewBox="0 0 24 24"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5a2.5 2.5 0 0 1 0-5 2.5 2.5 0 0 1 0 5z"/></svg>
            ${s.room}
          </div>
        </div>
      </div>`;
  }

  list.innerHTML = html;
}

function selectDay(day) {
  activeDay = day;
  renderDaysBar();
  renderTimeline();
}

document.getElementById("sectionSelect").addEventListener("change", (e) => {
  activeGroup = e.target.value;
  renderTimeline();
});

renderDaysBar();
renderTimeline();
</script>
</body>
</html>
